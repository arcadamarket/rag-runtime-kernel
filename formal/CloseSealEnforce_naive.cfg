\* Refutation config: naive single-field guards are unsound.
\* Expect: TLC reports NaiveReadySound (or NaivePhaseSound) violated with a
\* counterexample -- [phase |-> PARTIAL, ready |-> TRUE] for the ready-only
\* guard, or [phase |-> COMPLETE, ready |-> FALSE] for the phase-only guard.
CONSTANTS
  COMPLETE = COMPLETE
  PARTIAL  = PARTIAL
  NONE     = NONE
SPECIFICATION Spec
INVARIANT NaiveReadySound
INVARIANT NaivePhaseSound
