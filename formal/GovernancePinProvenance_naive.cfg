\* Refutation config: both naive pin guards are unsound.
\* Expect: TLC reports NaiveAllTokensSound (and/or NaiveClaimSound) violated with
\* a counterexample --
\*   NaiveAllTokensSound : [declared |-> {LIVE}, history |-> {OLD}] — a correctly
\*     refreshed pin that records its own audit trail; the all-tokens guard fires
\*     a false ERROR on the history token.
\*   NaiveClaimSound     : [declared |-> {}, claims |-> TRUE] — an unverifiable
\*     pin claim escalated from WARNING to a release-blocking ERROR.
CONSTANTS
  LIVE  = LIVE
  OLD   = OLD
  STRAY = STRAY
SPECIFICATION Spec
INVARIANT NaiveAllTokensSound
INVARIANT NaiveClaimSound
