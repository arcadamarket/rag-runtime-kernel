\* Refutation config: the NAIVE (first-field-only) guard is unsound.
\* Expect: TLC reports INVARIANT NaiveSound violated + a counterexample
\* (a payload carrying a declared-secret value in a non-first field that the
\* naive guard wrongly accepts).
CONSTANTS
  Plain       = Plain
  SecretVal   = SecretVal
  SecretLike  = SecretLike
  Fingerprint = Fingerprint
